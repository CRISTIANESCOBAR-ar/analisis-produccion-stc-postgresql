version: '3.9'

services:
  # App (Frontend build + Backend API en un solo contenedor)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stc_app
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_DIST: /app/frontend/dist
      CSV_FOLDER: /data/csv
      # Conexión a Postgres dentro de la red de compose
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: stc_produccion
      PG_USER: stc_user
      # Usar la contraseña ACTUAL del volumen existente; esto no la cambia.
      PG_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
      STC_AUTH_USER: ${STC_AUTH_USER:?Configure STC_AUTH_USER en .env}
      STC_AUTH_PASSWORD: ${STC_AUTH_PASSWORD:?Configure STC_AUTH_PASSWORD en .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      STC_BACKUP_DIR: /data/backups
      # Reintentos de conexión al arrancar (evita fallos por timing)
      PG_CONNECT_ATTEMPTS: 60
      PG_CONNECT_DELAY_MS: 1000
    ports:
      - "3001:3001"
    volumes:
      # Monta la carpeta de CSV del host dentro del contenedor.
      # En servidor, define STC_CSV_HOST_PATH en un .env junto al compose.
      - ${STC_CSV_HOST_PATH:-./csv}:/data/csv
      - app_backups:/data/backups
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - stc_network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: stc_postgres
    environment:
      POSTGRES_DB: stc_produccion
      POSTGRES_USER: stc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=es_ES.UTF-8"
    ports:
      - "${STC_DB_BIND:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stc_user -d stc_produccion"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stc_network

  # pgAdmin (Opcional - para administración visual)
  pgadmin:
    profiles: ["admin"]
    image: dpage/pgadmin4:latest
    container_name: stc_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stc.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${STC_PGADMIN_BIND:-127.0.0.1}:5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - stc_network

volumes:
  app_backups:
    name: stc_app_backups
  postgres_data:
    name: stc_postgres_data
  pgadmin_data:
    name: stc_pgadmin_data

networks:
  stc_network:
    name: stc_network
    driver: bridge
